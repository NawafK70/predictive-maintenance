[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "turbofan-rul"
version = "1.0.0"
description = "Remaining useful life prediction for turbofan engines (NASA C-MAPSS), with a FastAPI service and Streamlit demo."
readme = "README.md"
requires-python = ">=3.12"
# Libraries whose objects end up inside the pickled model are pinned exactly:
# loading a model with different versions can fail or silently change predictions.
dependencies = [
    "numpy==2.5.4",
    "pandas==3.1.0",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
    "xgboost-cpu==3.4.1; sys_platform == 'linux'",  # CPU build: skips ~200 MB of CUDA libraries
    "xgboost==3.4.1; sys_platform != 'linux'",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
report = ["matplotlib>=3.9", "tabulate>=0.9"]
demo = ["streamlit>=1.40", "altair>=5"]
dev = ["turbofan-rul[report,demo]", "pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
rul-data = "turbofan_rul.data:main"
rul-train = "turbofan_rul.train:main"
rul-report = "turbofan_rul.report:main"
rul-monitor = "turbofan_rul.monitor:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:starlette.*", "ignore::DeprecationWarning:fastapi.*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
